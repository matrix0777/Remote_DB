<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Team Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-md border border-slate-200 w-full max-w-md">
        <!-- Page Header -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">Team Workspace</h1>
            <p class="text-slate-500 text-sm mt-1">Sign in to access your dashboard</p>
        </div>

        <!-- Inline Error Banner -->
        <div id="errorMessage" class="hidden bg-red-50 text-red-600 p-3 rounded-lg text-sm mb-4 border border-red-200 text-center"></div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label for="username" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                    required
                >
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                    required
                >
            </div>

            <button
                type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition duration-150 shadow-sm"
            >
                Log In
            </button>
        </form>
    </div>

    <!-- Frontend Logic Script -->
    <script>
        // Redirect to dashboard immediately if token is already present
        if (localStorage.getItem("token")) {
            window.location.href = "/";
        }

        async function handleLogin(e) {
            e.preventDefault();

            const errorDiv = document.getElementById("errorMessage");
            errorDiv.classList.add("hidden");
            errorDiv.innerText = "";

            const usernameInput = document.getElementById("username").value.trim();
            const passwordInput = document.getElementById("password").value;

            // Format as x-www-form-urlencoded required by FastAPI OAuth2PasswordRequestForm
            const formData = new URLSearchParams();
            formData.append("username", usernameInput);
            formData.append("password", passwordInput);

            try {
                const response = await fetch("/token", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || "Invalid username or password.");
                }

                // Store access token locally and redirect to workspace
                localStorage.setItem("token", data.access_token);
                window.location.href = "/";

            } catch (err) {
                errorDiv.innerText = err.message;
                errorDiv.classList.remove("hidden");
            }
        }
    </script>
</body>
</html>
